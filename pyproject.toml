[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dyasi"
version = "0.1.0"
description = "DYASI is an open-source web/API security testing framework designed to minimize unnecessary LLM usage while preserving AI-assisted security reasoning."
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
